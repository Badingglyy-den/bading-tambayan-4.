name: Deploy private-message push function

on:
  workflow_dispatch:
  push:
    paths:
      - "supabase/functions/send-dm-push/**"
      - ".github/workflows/deploy-dm-push.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy send-dm-push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing GitHub Actions secret: SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          supabase functions deploy send-dm-push --project-ref lieisalrqexbqvgjwekv --no-verify-jwt
